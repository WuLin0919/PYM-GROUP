<footer class="footer site-footer border-top bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="footer-inner">
            <div class="footer-updated">
                <div class="text-muted">
                    <i>Last updated: <time datetime="{{ 'now' | date: '%Y-%m-%d' }}">{{ "now" | date: "%b %d, %Y" }}</time></i>
                </div>
            </div>
            <div class="footer-note">
                <div class="text-muted">
                    {{ site.data.site_settings.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
